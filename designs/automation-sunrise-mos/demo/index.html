<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交互设计稿 demo · 日出日落 + 多动作 + 风险二次确认</title>
<style>

/* ============================================================================
   交互设计稿 demo · 手工复刻 Element Plus 2.14 视觉语言
   颜色/间距/圆角/断点全部取自 frontend-shared/src/styles/theme.css 的亮色块
   （--color-* :27-35、--text-color-* :48-51、--border-color :54-56、
     EP 桥接 --el-color-*-light-9 :212-257、断点 :8-13、.el-dialog max-width:92vw :729-733）
   本文件不加载任何外部资源，不依赖 element-plus。
   ========================================================================== */
:root{
  --breakpoint-xs:480px; --breakpoint-md:768px;
  --color-primary:#1f5ad8; --color-success:#147a3a; --color-warning:#9a5b06; --color-danger:#b91c1c; --color-info:#5e6673;
  --bg-color-page:#f5f7fa; --bg-color:#ffffff; --bg-color-overlay:#ffffff; --bg-color-secondary:#f8f9fb;
  --text-color-primary:#303133; --text-color-regular:#4b5563; --text-color-secondary:#5e6673; --text-color-placeholder:#6b7280;
  --border-color:#e8eaec; --border-color-light:#ebeef5; --border-color-lighter:#f2f6fc;
  --card-bg:#ffffff; --card-border:#e8eaec; --card-shadow:0 2px 12px rgba(0,0,0,0.08);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 24px rgba(0,0,0,0.12);
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px;
  --el-color-primary:#1f5ad8; --el-color-primary-light-3:#628ce4; --el-color-primary-light-5:#8fadec;
  --el-color-primary-light-7:#bccef3; --el-color-primary-light-8:#d2def7; --el-color-primary-light-9:#e9effb;
  --el-color-success:#147a3a; --el-color-success-light-8:#d0e4d8; --el-color-success-light-9:#e8f2eb;
  --el-color-warning:#9a5b06; --el-color-warning-light-5:#cdad83; --el-color-warning-light-7:#e1ceb4; --el-color-warning-light-9:#f5efe6;
  --el-color-danger:#b91c1c; --el-color-danger-light-3:#ce6060; --el-color-danger-light-5:#dc8e8e; --el-color-danger-light-7:#eabbbb; --el-color-danger-light-9:#f8e8e8;
  --el-color-info:#5e6673; --el-color-info-light-5:#afb3b9; --el-color-info-light-9:#eff0f1;
  --el-fill-color-light:#f5f7fa; --el-fill-color-lighter:#f8f9fb;
  --el-text-color-primary:#303133; --el-text-color-regular:#4b5563; --el-text-color-secondary:#5e6673; --el-text-color-placeholder:#6b7280;
  --el-border-color:#e8eaec; --el-border-color-lighter:#ebeef5;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-color-page);color:var(--text-color-primary);font-size:14px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'DejaVu Sans Mono',Consolas,Menlo,'Courier New',monospace}
.hint{margin-left:8px;color:var(--text-color-secondary);font-size:12px}
.text-muted{color:var(--text-color-secondary)}

/* ---------- 演示脚手架（非设计稿内容，?bar=0 可隐藏） ---------- */
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:#fffbe6;border-bottom:1px dashed var(--el-color-warning);font-size:12px;color:var(--text-color-secondary)}
.demo-bar b{color:var(--text-color-primary)}
.demo-bar .demo-sep{flex:1 1 100%;height:0}
.demo-bar button{font-family:inherit;font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--el-color-warning-light-5);background:#fff;color:var(--el-color-warning);cursor:pointer}
.demo-bar button:hover{background:var(--el-color-warning-light-9)}
.demo-bar button[aria-pressed="true"]{background:var(--el-color-warning);border-color:var(--el-color-warning);color:#fff}

/* ---------- PageHeader（复刻 components/common/PageHeader.vue:34-85） ---------- */
.page-header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:var(--bg-color);border-bottom:1px solid var(--border-color);margin-bottom:16px}
.page-header-left{display:flex;align-items:center;gap:12px}
.page-header-left h2{margin:0;font-size:20px;font-weight:500;color:var(--text-color-primary)}
.page-header-subtitle{margin:4px 0 0;font-size:13px;color:var(--text-color-secondary)}
.page-header-right{display:flex;align-items:center;gap:8px}

.page{display:flex;flex-direction:column;gap:16px;padding:0 24px 32px}
/* 复刻 AutomationRules.vue:881 .card */
.card{background:var(--el-bg-color);border-radius:8px;padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.count-tag{margin-left:0}

/* ---------- el-button ---------- */
.el-button{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 15px;
  border:1px solid var(--el-border-color);border-radius:var(--radius-sm);background:var(--bg-color);
  color:var(--text-color-regular);font-size:14px;font-family:inherit;cursor:pointer;
  transition:border-color .15s,background-color .15s,color .15s;white-space:nowrap;
}
.el-button:hover{border-color:var(--el-color-primary-light-5);color:var(--el-color-primary);background:var(--el-color-primary-light-9)}
.el-button--primary{background:var(--el-color-primary);border-color:var(--el-color-primary);color:#fff}
.el-button--primary:hover{background:var(--el-color-primary-light-3);border-color:var(--el-color-primary-light-3);color:#fff}
.el-button--danger{background:var(--el-color-danger);border-color:var(--el-color-danger);color:#fff}
.el-button--danger:hover{background:var(--el-color-danger-light-3);border-color:var(--el-color-danger-light-3);color:#fff}
.el-button--small{height:24px;padding:0 9px;font-size:12px;border-radius:var(--radius-sm)}
.el-button.is-link{border-color:transparent;background:transparent;height:24px;padding:0 4px;font-size:12px;color:var(--el-color-primary)}
.el-button.is-link:hover{background:transparent;color:var(--el-color-primary-light-3);border-color:transparent}
.el-button.is-link.el-link--danger{color:var(--el-color-danger)}
.el-button.is-link.el-link--danger:hover{color:var(--el-color-danger-light-3)}
.el-button:disabled,.el-button[disabled]{opacity:.55;cursor:not-allowed}
.el-button:disabled:hover{border-color:var(--el-border-color);color:var(--text-color-regular);background:var(--bg-color)}
.el-button--danger:disabled:hover{background:var(--el-color-danger);border-color:var(--el-color-danger);color:#fff}
.el-button:focus-visible,.el-switch:focus-visible,.op-item:focus-visible,.el-select__wrapper:focus-visible,.risk-ack input:focus-visible{
  outline:2px solid var(--el-color-primary);outline-offset:1px
}

/* ---------- el-tag ---------- */
.el-tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;line-height:1;border:1px solid transparent;white-space:nowrap}
.el-tag--primary{background:var(--el-color-primary-light-9);color:var(--el-color-primary)}
.el-tag--success{background:var(--el-color-success-light-9);color:var(--el-color-success)}
.el-tag--warning{background:var(--el-color-warning-light-9);color:var(--el-color-warning)}
.el-tag--danger{background:var(--el-color-danger-light-9);color:var(--el-color-danger)}
.el-tag--info{background:var(--el-color-info-light-9);color:var(--el-color-info)}
.el-tag.is-plain{background:var(--bg-color);border-color:currentColor}
.el-tag--small{height:20px;font-size:11px;padding:0 6px}

/* ---------- el-alert ---------- */
.el-alert{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px}
.el-alert--warning{background:var(--el-color-warning-light-9);color:var(--el-color-warning)}
.el-alert--error{background:var(--el-color-danger-light-9);color:var(--el-color-danger)}
.el-alert--info{background:var(--el-color-info-light-9);color:var(--el-color-info)}
.el-alert__icon{flex:0 0 auto;font-weight:700}
.el-alert__title{font-weight:600}
.el-alert__desc{color:var(--text-color-regular);margin-top:2px}

/* ---------- 表单 ---------- */
.el-form-item{display:flex;gap:12px;margin-bottom:18px}
.el-form-item__label{flex:0 0 110px;text-align:right;padding-top:6px;color:var(--text-color-regular);font-size:14px;line-height:22px}
.el-form-item__label.is-required::before{content:'*';color:var(--el-color-danger);margin-right:4px}
.el-form-item__content{flex:1;min-width:0}
.el-input,.el-textarea{width:100%;border:1px solid var(--el-border-color);border-radius:var(--radius-sm);background:var(--bg-color);color:var(--text-color-regular);font-size:14px;font-family:inherit}
.el-input{height:32px;padding:0 11px}
.el-textarea{padding:6px 11px;resize:vertical;line-height:1.5}
.el-input:focus,.el-textarea:focus{outline:none;border-color:var(--el-color-primary);box-shadow:0 0 0 1px var(--el-color-primary) inset}
.el-input[readonly]{background:var(--el-fill-color-light);color:var(--text-color-secondary)}
.el-input--number{width:120px}
.inline-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- el-select（含 ARIA combobox） ---------- */
.el-select{position:relative;width:100%}
.el-select__wrapper{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;padding:0 11px;border:1px solid var(--el-border-color);border-radius:var(--radius-sm);background:var(--bg-color);cursor:pointer}
.el-select__wrapper:hover{border-color:var(--el-color-primary-light-5)}
.el-select__wrapper[aria-expanded="true"]{border-color:var(--el-color-primary);box-shadow:0 0 0 1px var(--el-color-primary) inset}
.el-select__caret{color:var(--text-color-placeholder);font-size:12px}
.el-select__dropdown{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);margin:0;padding:6px 0;list-style:none;max-height:240px;overflow:auto;background:var(--bg-color-overlay);border:1px solid var(--border-color);border-radius:var(--radius-sm);box-shadow:var(--shadow-md)}
.el-select__item{display:flex;align-items:center;justify-content:space-between;gap:8px;height:34px;padding:0 20px;font-size:14px;color:var(--text-color-regular);cursor:pointer}
.el-select__item.is-active,.el-select__item:hover{background:var(--el-fill-color-light)}
.el-select__item[aria-selected="true"]{color:var(--el-color-primary);font-weight:600}
.el-select__item[aria-disabled="true"]{color:var(--text-color-placeholder);cursor:not-allowed}

/* ---------- el-switch ---------- */
.el-switch{position:relative;display:inline-flex;flex:0 0 auto;width:40px;height:20px;border-radius:10px;background:var(--el-color-info-light-5);cursor:pointer;transition:background-color .2s}
.el-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.el-switch.is-checked{background:var(--el-color-primary)}
.el-switch.is-checked::after{left:22px}

/* ---------- el-table（复刻，仅用于规则列表） ---------- */
.el-table{width:100%;border-collapse:collapse;font-size:14px}
.el-table th{background:var(--el-fill-color-light);color:var(--text-color-primary);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--el-border-color);font-size:13px;white-space:nowrap}
.el-table td{padding:10px 12px;border-bottom:1px solid var(--el-border-color-lighter);color:var(--text-color-regular);vertical-align:middle}
.el-table tr:last-child td{border-bottom:none}
.cell-flex{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ---------- 多动作卡片列表 ---------- */
.action-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.action-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.action-card{border:1px solid var(--el-border-color-lighter);border-radius:var(--radius-md);padding:12px;background:var(--bg-color)}
.action-card[data-risk="1"]{border-color:var(--el-color-danger-light-5);background:linear-gradient(0deg,var(--el-color-danger-light-9),var(--el-color-danger-light-9))}
.action-card__head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.action-card__index{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--el-color-primary-light-9);color:var(--el-color-primary);font-size:12px;font-weight:600;flex:0 0 auto}
.action-card__name{font-size:14px;font-weight:600;color:var(--text-color-primary)}
.action-card__ops{margin-left:auto;display:flex;align-items:center;gap:4px}
.action-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:10px 0 0}
.action-meta>div{display:flex;gap:6px;min-width:0}
.action-meta>div.span2{grid-column:1 / -1}
.action-meta dt{flex:0 0 auto;color:var(--text-color-secondary);font-size:12px}
.action-meta dd{margin:0;font-size:12px;color:var(--text-color-regular);overflow-wrap:anywhere}
.risk-badge{font-weight:600}
.risk-reason{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:8px 10px;border-left:3px solid var(--el-color-danger);border-radius:var(--radius-sm);background:var(--bg-color);font-size:12px;color:var(--text-color-regular)}
.risk-reason__icon{color:var(--el-color-danger);font-weight:700;flex:0 0 auto}
.risk-reason__label{font-weight:600;color:var(--el-color-danger)}
.assumption-note{margin-top:10px;padding:6px 10px;border:1px dashed var(--el-color-warning-light-5);border-radius:var(--radius-sm);background:var(--el-color-warning-light-9);font-size:12px;color:var(--text-color-regular)}

/* ---------- 设备控制面板（复刻 DeviceControlPanel.vue 的 .op-list） ---------- */
.ops-sub{margin:0 0 10px;font-size:12px;color:var(--text-color-secondary)}
.op-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.op-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--el-border-color-lighter);border-radius:var(--radius-md);background:var(--bg-color);cursor:pointer;text-align:left;font-family:inherit;font-size:14px;color:inherit}
.op-item:hover{border-color:var(--el-color-primary-light-5);box-shadow:var(--shadow-sm)}
.op-item[data-risk="1"]{border-color:var(--el-color-danger-light-5)}
.op-icon{flex:0 0 auto;margin-top:2px;color:var(--el-color-primary);font-size:18px}
.op-text{display:block;min-width:0}
.op-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:500;color:var(--text-color-primary)}
.op-desc{margin-top:4px;font-size:12px;color:var(--text-color-secondary);overflow-wrap:anywhere}

/* ---------- el-dialog / el-overlay ---------- */
.el-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto;background:rgba(0,0,0,.45)}
.el-dialog{width:min(640px,92vw);max-height:88vh;display:flex;flex-direction:column;background:var(--bg-color-overlay);border-radius:2px;box-shadow:var(--shadow-lg)}
.el-dialog--sm{width:min(440px,92vw)}
.el-dialog__header{padding:16px;padding-bottom:8px;font-size:16px;font-weight:600;color:var(--text-color-primary)}
.el-dialog__body{padding:0 16px 16px;overflow:auto}
.el-dialog__footer{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:16px;padding-top:8px}
.el-dialog__footer .ack-progress{margin-right:auto;font-size:12px;color:var(--text-color-secondary)}
.risk-line{margin:12px 0;color:var(--text-color-secondary);font-size:13px}
.risk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.risk-item{border:1px solid var(--el-color-danger-light-5);border-radius:var(--radius-md);padding:10px 12px;background:var(--bg-color)}
.risk-item__name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;color:var(--text-color-primary);font-size:14px}
.risk-item__meta{display:grid;grid-template-columns:1fr;gap:2px;margin:8px 0 0}
.risk-item__meta>div{display:flex;gap:6px;font-size:12px;min-width:0}
.risk-item__meta dt{flex:0 0 60px;color:var(--text-color-secondary)}
.risk-item__meta dd{margin:0;color:var(--text-color-regular);overflow-wrap:anywhere}
.risk-ack{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--text-color-regular);cursor:pointer}
.risk-ack input{width:16px;height:16px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--el-color-danger)}
.param-echo{margin-top:8px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--el-fill-color-light);font-size:12px}

/* ---------- el-message ---------- */
#toast-root{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.el-message{display:flex;align-items:center;gap:8px;padding:11px 15px;border-radius:var(--radius-sm);border:1px solid var(--el-color-success-light-8);background:var(--el-color-success-light-9);color:var(--el-color-success);font-size:14px;box-shadow:var(--shadow-md)}

/* ============================================================================
   响应式：768px 与仓库 useResponsive/theme.css 同断点；480px 为任务书要求的窄屏档
   ========================================================================== */
@media (max-width:768px){
  .page-header{padding:14px 16px;align-items:flex-start;gap:12px}
  .page-header-left h2{font-size:18px}
  .page-header-right{flex-wrap:wrap;justify-content:flex-end}
  .page{padding:0 16px 24px}
  .op-list{grid-template-columns:1fr}
  .action-meta{grid-template-columns:1fr}
  .el-form-item{display:block}
  .el-form-item__label{flex:none;display:block;text-align:left;padding:0 0 6px}
  .el-dialog{width:92vw}
}
@media (max-width:480px){
  body{font-size:13px}
  .page{padding:0 12px 24px;gap:12px}
  .card{padding:12px}
  /* 弹窗改为底部抽屉：单列、贴底、占满宽度，避免 640px 宽弹窗在 390px 上被裁 */
  .el-overlay{padding:0;align-items:flex-end}
  .el-dialog,.el-dialog--sm{width:100%;max-width:100%;max-height:92vh;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
  .el-dialog__header,.el-dialog__body,.el-dialog__footer{padding-left:14px;padding-right:14px}
  .el-dialog__footer{flex-wrap:wrap}
  .el-dialog__footer .ack-progress{flex:1 1 100%;margin:0 0 4px}
  .el-dialog__footer .el-button{flex:1 1 auto;min-height:44px}
  /* 触控目标：窄屏行内按钮补足 44px（theme.css:801-816 同口径） */
  .el-button{min-height:36px}
  .el-button--small,.el-button.is-link{height:auto;min-height:36px;min-width:36px}
  .action-card__ops{margin-left:0;width:100%;justify-content:flex-end;gap:2px}
  .action-card__head{align-items:flex-start}
  .action-card__name{flex:1 1 100%}
  .action-meta>div{flex-direction:column;gap:0}
  .risk-item__meta>div{flex-direction:column;gap:0}
  .risk-item__meta dt{flex:none}
  .rules-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .el-table{min-width:560px}
  .mobile-table-hint{display:block}
}
.spotlight{outline:2px dashed var(--el-color-primary);outline-offset:2px;border-radius:var(--radius-sm)}
.mode-choice{margin:0 0 12px;padding:10px 12px;border:1px dashed var(--el-color-warning-light-5);border-radius:var(--radius-sm);background:var(--el-color-warning-light-9);font-size:12px;color:var(--text-color-regular)}
.mode-choice__title{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--el-color-warning);margin-bottom:6px}
.mode-choice__row{display:flex;gap:8px;margin-top:4px}
.mode-choice__k{flex:0 0 48px;font-weight:600;color:var(--text-color-primary)}
.mode-choice__foot{margin-top:8px;padding-top:6px;border-top:1px dashed var(--el-color-warning-light-5);color:var(--text-color-secondary)}
.mode-chip{margin:0 0 12px;padding:8px 12px;border-radius:var(--radius-sm);background:var(--el-color-primary-light-9);color:var(--el-color-primary);font-size:12px}
@media (max-width:480px){.mode-choice__row{flex-direction:column;gap:0}.mode-choice__k{flex:none}}
.mobile-table-hint{display:none;font-size:12px;color:var(--text-color-secondary);text-align:center;padding:4px 0 8px;user-select:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>
<script>

(function () {
  'use strict';

  /* ==========================================================================
     1. 数据模型（与既有后端/前端契约对齐，字段名取自 AutomationRules.vue 的表单模型）
        · 触发器枚举现状 = sensor_threshold | time_window | event
          （frontend-shared/src/api/automation.ts:12-15）

  /* ==========================================================================
     6. 交互
     ========================================================================== */
  function applySelect(id, raw) {
    state.openSelect = null;
    if (id === 'trigger-type' || id === 'sun-kind') {
      state.trigger.type = raw;
    } else if (id.indexOf('card-device-') === 0) {
      var c = findCard(Number(id.slice(12)));
      if (c) {
        c.deviceId = Number(raw);
        var first = (ACTION_CATALOG[c.deviceId] || [])[0];
        if (first) c.actionId = first.id;
        c.params = {};
      }
    } else if (id.indexOf('card-action-') === 0) {
      var c2 = findCard(Number(id.slice(12)));
      if (c2) { c2.actionId = raw; c2.params = {}; }
    } else if (id === 'bool-charge') {
      state.manualParams.charge_software_closed = (raw === 'true');
    } else if (id === 'bool-discharge') {
      state.manualParams.discharge_software_closed = (raw === 'true');
    } else if (id === 'priority') {
      state.manualParams.priority = raw;
    }
    state.focusKey = 'sel-' + id;
    render();
  }
  function focusOption(id, idx) {
    state.selectActive[id] = idx;
    state.focusKey = id + '-opt-' + idx;
    render();
  }
  function currentIndex(id, optsKey) {
    var list = opts(optsKey), value = valueOfSelect(id);
    for (var i = 0; i < list.length; i++) { if (String(list[i].v) === String(value)) return i; }
    return 0;
  }
  function closeDialog(name) {
    state.dialogs = state.dialogs.filter(function (d) { return d !== name; });
    state.focusKey = '';
    render();
  }
  function onSave() {
    var risks = riskActions();
    if (!risks.length) {
      state.dialogs = [];
      render();
      toast('规则已保存（无风险动作，未弹出二次确认）');
      return;
    }
    state.acked = {};
    state.dialogs = ['rule', 'save-risk'];
    state.autofocus = true;
    render();
  }
  function addAction() {
    var uid = state.nextUid++;
    state.actions.push({ uid: uid, deviceId: 1, actionId: 'gpio_set', params: { pin: 13, level: 1 } });
    render();
  }
  function moveAction(uid, delta) {
    var i = -1;
    for (var k = 0; k < state.actions.length; k++) { if (state.actions[k].uid === uid) i = k; }
    if (i < 0) return;
    var j = i + delta;
    if (j < 0 || j >= state.actions.length) return;
    var tmp = state.actions[i];
    state.actions[i] = state.actions[j];
    state.actions[j] = tmp;
    render();
  }

  document.addEventListener('click', function (e) {
    var node = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    var act = node ? node.dataset.act : '';
    if (state.openSelect && !(e.target.closest && e.target.closest('.el-select'))) {
      state.openSelect = null;
      if (!act) { render(); return; }
    }
    if (!act) return;
    if (act === 'toggle-select') {
      var id = node.dataset.select;
      if (state.openSelect === id) { state.openSelect = null; }
      else { state.openSelect = id; state.selectActive[id] = currentIndex(id, node.dataset.opts); }
      state.focusKey = 'sel-' + id;
      render();
      return;
    }
    if (act === 'option') {
      var list = opts(node.dataset.opts);
      var o = list[Number(node.dataset.index)];
      if (!o || o.disabled) return;
      applySelect(node.dataset.select, String(o.v));
      return;
    }
    if (act === 'switch') { node.setAttribute('aria-checked', node.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
      node.classList.toggle('is-checked'); return; }
    if (act === 'open-rule') { state.dialogs = ['rule']; state.currentState = ''; state.spotlight = ''; state.scrollTo = ''; state.focusKey = ''; render(); return; }
    if (act === 'close-dialog') { closeDialog(node.dataset.dialog); return; }
    if (act === 'save') { onSave(); return; }
    if (act === 'add-action') { addAction(); return; }
    if (act === 'move-up') { moveAction(Number(node.dataset.uid), -1); return; }
    if (act === 'move-down') { moveAction(Number(node.dataset.uid), 1); return; }
    if (act === 'remove-action') {
      var uid = Number(node.dataset.uid);
      state.actions = state.actions.filter(function (c) { return c.uid !== uid; });
      delete state.acked[uid];
      render();
      return;
    }
    if (act === 'edit-params') {
      var c = findCard(Number(node.dataset.uid));
      state.editingUid = c ? c.uid : null;
      state.paramsDraft = c ? JSON.stringify(c.params, null, 2) : '{}';
      state.dialogs = state.dialogs.concat(['edit-params']);
      render();
      return;
    }
    if (act === 'params-done') {
      var cc = findCard(state.editingUid);
      try {
        var parsed = JSON.parse(state.paramsDraft);
        if (cc) cc.params = parsed && typeof parsed === 'object' ? parsed : {};
        closeDialog('edit-params');
      } catch (err) {
        toast('动作参数 JSON 格式错误');
      }
      return;
    }
    if (act === 'ack') { return; }
    if (act === 'cancel-save') { state.acked = {}; closeDialog('save-risk'); return; }
    if (act === 'confirm-save') {
      var n = riskActions().length;
      state.dialogs = [];
      state.acked = {};
      render();
      toast('规则已保存（' + n + ' 个风险动作已逐项确认）');
      return;
    }
    if (act === 'op') {
      var opId = node.dataset.op;
      var action = findAction(state.manualDeviceId, opId);
      if (!action) return;
      state.manualActionId = opId;
      if (isRisk(action)) {
        state.dialogs = ['manual-form'];
        state.focusKey = '';
      } else {
        toast('操作已排队：' + action.name + '（普通动作，无二次确认）');
      }
      render();
      return;
    }
    if (act === 'manual-form-next') { state.dialogs = ['manual-confirm']; state.autofocus = true; render(); return; }
    if (act === 'manual-confirm-submit') {
      var a = findAction(state.manualDeviceId, state.manualActionId);
      state.dialogs = [];
      render();
      toast('操作已排队：' + (a ? a.name : '') + '（已记录操作理由）');
      return;
    }
    if (act === 'variant') {
      var q = new URLSearchParams(location.search);
      if (node.dataset.variant) q.set('variant', node.dataset.variant); else q.delete('variant');
      location.search = q.toString();
      return;
    }
    if (act === 'view') { state.view = node.dataset.view; state.currentState = ''; state.spotlight = ''; render(); return; }
    if (act === 'toggle-normal') { state.onlyNormal = !state.onlyNormal; state.acked = {}; render(); return; }
    if (act === 'goto-state') { applyState(node.dataset.state); render(); return; }
    if (act === 'delete-rule') {
      toast('演示稿：删除规则沿用既有 confirmDanger 危险确认（AutomationRules.vue:655-671）');
      return;
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.dataset && t.dataset.act === 'ack') {
      state.acked[t.dataset.uid] = t.checked;
      state.focusKey = 'ack-' + t.dataset.uid;
      render();
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.dataset) return;
    if (t.dataset.act === 'rule-name') { state.name = t.value; return; }
    if (t.dataset.act === 'sun-offset') {
      var v = parseInt(t.value, 10);
      if (isNaN(v)) v = 0;
      state.trigger.offset = v;
      var s = document.getElementById('offset-sentence');
      if (s) s.textContent = offsetText(state.trigger.type, v);
      return;
    }
    if (t.dataset.act === 'manual-reason') {
      state.manualReason = t.value;
      var btn = document.querySelector('[data-act="manual-confirm-submit"]');
      if (btn) btn.disabled = state.manualReason.trim().length === 0;
      return;
    }
    if (t.dataset.act === 'params-json') { state.paramsDraft = t.value; return; }
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (!t || !t.dataset) return;
    var act = t.dataset.act;
    if (act === 'toggle-select') {
      var id = t.dataset.select;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (state.openSelect !== id) {
          state.openSelect = id;
          state.selectActive[id] = currentIndex(id, t.dataset.opts);
          state.focusKey = 'sel-' + id;
          render();
        } else {
          focusOption(id, state.selectActive[id] || 0);
        }
        return;
      }
      if (e.key === 'Escape' && state.openSelect) { state.openSelect = null; render(); }
      return;
    }
    if (act === 'option') {
      var oid = t.dataset.select;
      var list = opts(t.dataset.opts);
      var idx = Number(t.dataset.index);
      if (e.key === 'ArrowDown') { e.preventDefault(); focusOption(oid, Math.min(idx + 1, list.length - 1)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); focusOption(oid, Math.max(idx - 1, 0)); }
      else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (list[idx] && !list[idx].disabled) applySelect(oid, String(list[idx].v));
      } else if (e.key === 'Escape') {
        e.preventDefault();
        state.openSelect = null;
        state.focusKey = 'sel-' + oid;
        render();
      }
      return;
    }
    if (act === 'switch' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      t.setAttribute('aria-checked', t.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
      t.classList.toggle('is-checked');
      return;
    }
  });

  /* ==========================================================================
     7. 六个演示状态的深链（?state=xxx）
     ========================================================================== */
  function applyState(name) {
    state.currentState = name;
    state.dialogs = [];
    state.openSelect = null;
    state.acked = {};
    state.spotlight = '';
    state.scrollTo = '';
    state.autofocus = false;
    state.focusKey = '';
    state.view = 'rules';
    state.onlyNormal = false;
    state.editingUid = null;
    if (name === 'sunrise') {
      state.dialogs = ['rule']; state.spotlight = 'trigger'; state.focusKey = 'sel-trigger-type';
    } else if (name === 'actions') {
      state.dialogs = ['rule']; state.scrollTo = 'action-section';
    } else if (name === 'risk') {
      state.dialogs = ['rule']; state.scrollTo = 'action-card-1'; state.spotlight = 'action-1';
    } else if (name === 'save-risk') {
      state.dialogs = ['rule', 'save-risk']; state.autofocus = true;
    } else if (name === 'manual') {
      state.view = 'device'; state.dialogs = ['manual-confirm']; state.spotlight = 'op-set_mos_policy'; state.autofocus = true;
    } else if (name === 'normal') {
      state.onlyNormal = true; state.dialogs = ['rule']; state.scrollTo = 'action-section'; state.spotlight = 'action-3';
    }
  }

  var initial = params.get('state');
  if (initial) applyState(initial);
  render();
})();

</script>
