name: Build and Publish Docker Image

# 触发条件:
#   1. 推送到 master / main 分支(主分支自动构建)
#   2. 推送 v* 形式的 tag(发布版本时打 tag 自动构建)
#   3. 手动触发(workflow_dispatch)
on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - 'frontend-shared/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 生成以下 tag:
          #   - master 分支 → ghcr.io/lstions/ehome:master
          #   - v1.0.0 tag  → ghcr.io/lstions/ehome:1.0.0 + latest
          #   - 任意 commit → ghcr.io/lstions/ehome:sha-xxxxxxx
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ⚠ GIT_COMMIT 必须显式传进去（2026-10-23 发现缺口）：
      #   Dockerfile 用 -ldflags "-X main.buildCommit=${GIT_COMMIT}" 把来源烙进二进制，
      #   而 buildCommit 默认值是 "unknown"。metadata-action 只会生成 **OCI label**
      #   （org.opencontainers.image.revision），它不会自动变成 build-arg ——
      #   缺这一行时镜像 label 有 commit，但 /health 回显的 commit 是 "unknown"，
      #   而部署验收靠的正是 /health（见 docs/操作/部署-来源组-2026-10-23.md §三）。
      #   实测旧一次 CI 产物 ghcr.io/lstions/ehome:main 的 label=64fbe90b，
      #   容器内却找不到对应二进制烙印 ⇒ 「部署的到底是哪份代码」不可查。
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
