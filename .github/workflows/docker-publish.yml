name: Build and Publish Docker Image

# 触发条件:
#   1. 推送到 master / main 分支(主分支自动构建)
#   2. 推送 v* 形式的 tag(发布版本时打 tag 自动构建)
#   3. 手动触发(workflow_dispatch)
on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - 'frontend-shared/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 生成以下 tag:
          #   - master 分支 → ghcr.io/lstions/ehome:master
          #   - v1.0.0 tag  → ghcr.io/lstions/ehome:1.0.0 + latest
          #   - 任意 commit → ghcr.io/lstions/ehome:sha-xxxxxxx
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
