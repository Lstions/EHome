name: Test CI

on:
  push:
    branches: [main, master, develop, 'v*']
    paths:
      - 'backend/**'
      - 'frontend-shared/**'
      - 'esp32-collector/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.env*'
      - '.github/workflows/**'
      - 'tools/**'
      - 'Makefile'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'frontend-shared/**'
      - 'esp32-collector/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.env*'
      - '.github/workflows/**'
      - 'tools/**'
      - 'Makefile'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 backend/go.mod 及 Dockerfile (golang:1.26.5-alpine) 保持一致，
  # 避免 runner 上触发 Go 工具链自动下载（慢且偶发失败）
  GO_VERSION: "1.26.5"
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # ─── Backend: lint + unit tests ──────────────────────────────────
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Go vet
        run: go vet ./...

      # go vet ./... 看不到 //go:build simulation 的文件（drivers_sim.go、
      # simulation/** 等 4 个包只在 -tags=simulation 下参与构建）。
      # 于是仿真专用代码可以在"CI 全绿"的情况下烂掉 —— 直到 backend-scenarios
      # job 需要真实 PG + EMQX 才发现，反馈慢且贵。
      # 本步骤不依赖任何外部服务，只做编译 + vet，把这段代码的可见性补回 main 门禁。
      # 覆盖分母：go list ./... = 35 包 → go list -tags=simulation ./... = 39 包。
      - name: Go vet (simulation build tag)
        run: go vet -tags=simulation ./...

      - name: Run unit tests (SQLite)
        run: |
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Coverage gate (≥35%)
        run: |
          COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COV}%"
          if [ "$(echo "$COV < 35" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COV}% is below 35% threshold"
            exit 1
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  # ─── Backend: PostgreSQL integration tests ───────────────────────
  backend-integration:
    name: Backend (PostgreSQL integration)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ehome
          POSTGRES_PASSWORD: ehome123
          POSTGRES_DB: ehome_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ehome"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run integration tests (PostgreSQL)
        env:
          EHOME_TEST_DB: postgres
          EHOME_DB_HOST: localhost
          EHOME_DB_PORT: 5432
          EHOME_DB_USER: ehome
          EHOME_DB_PASSWORD: ehome123
          EHOME_DB_NAME: ehome_test
        run: |
          go test -race -count=1 -tags=integration ./...

  # ─── Backend: scenario simulation (real PostgreSQL + real EMQX) ──
  # backend/simulation 的 preflight 是硬的：必须连真实 PostgreSQL（自建/自删
  # ehome_sim_<runid>，连维护库 postgres 执行 CREATE/DROP）与真实 EMQX（真实
  # MQTT 收发二进制帧），缺任何一方直接失败而非跳过。
  # 就绪判定一律用健康检查 + 显式轮询，不用固定 sleep。
  backend-scenarios:
    name: Backend (scenario simulation)
    runs-on: ubuntu-latest
    needs: backend
    services:
      # 与 backend-integration 完全相同的 PG 配置（同镜像 / 账号 / 库）。
      # POSTGRES_USER=ehome 即集群超级用户，故具备 CREATEDB 权限（harness 必需）。
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ehome
          POSTGRES_PASSWORD: ehome123
          POSTGRES_DB: ehome_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ehome"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # emqx ping = 节点存活探针（bin/emqx: assert_node_alive），已启动即 exit 0
      emqx:
        image: emqx/emqx:5.8
        ports:
          - 1883:1883
        options: >-
          --health-cmd "emqx ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # 服务容器健康检查只覆盖"容器内 EMQX 已启动"，不覆盖宿主端口映射；
      # 这里从 runner 侧显式轮询 1883，连得上才算真的可用（上限 60s）。
      - name: Wait for EMQX MQTT port (1883)
        run: |
          for i in $(seq 1 30); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/1883' 2>/dev/null; then
              echo "EMQX 1883 已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::EMQX 1883 在 60s 内不可达"
          exit 1

      - name: Run scenario simulation tests (real server + PG + EMQX)
        env:
          EHOME_DB_HOST: 127.0.0.1
          EHOME_DB_PORT: 5432
          EHOME_DB_USER: ehome
          EHOME_DB_PASSWORD: ehome123
          MQTT_BROKER: tcp://127.0.0.1:1883
          # 抢不到 run 级排他锁时快速失败，而不是等默认的 45m
          EHOME_SIM_LOCK_WAIT: 3s
        run: go test -tags=simulation -count=1 -timeout=30m ./simulation/...

      # 失败时把「哪个场景失败、为什么」写进 job summary。
      #
      # 为什么必须有这一步（2026-09-17 实测教训）：
      #   CI 失败时 annotation 只有 `Process completed with exit code 1.`（不含场景名），
      #   完整细节只在模拟证据 artifact 里，而 **artifact 下载需要认证**。
      #   于是定位一次偶发红必须先装 gh 再翻日志 —— 可诊断性太差。
      #   而 summary.json 里本来就有 `scenarios[].failure`，直接打出来即可。
      # 用 python3 而不是 jq：runner 上 python3 必然存在，jq 不保证。
      - name: Summarize failing scenarios (job summary)
        if: always()
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, json, os, sys
          # 容错：优先用 argv（CI 的实际用法），缺省回落到 $GITHUB_STEP_SUMMARY，
          # 再缺省打到 stdout —— 这样**同一条脚本能在本地原样演练**，
          # 不必为了测试它在本地伪造 CI 环境。
          out = sys.argv[1] if len(sys.argv) > 1 else os.environ.get('GITHUB_STEP_SUMMARY') or '/dev/stdout'
          latest, newest = None, -1.0
          for p in glob.glob('.logs/simulation/sim-*/summary.json'):
              m = os.path.getmtime(p)
              if m > newest:                     # 取最近一次 run（可能多个）
                  newest, latest = m, p
          lines = []
          if not latest:
              lines.append('## ⚠️ 未找到 simulation summary.json')
              lines.append('')
              lines.append('说明仿真实例可能在产生证据前就退出了（如 preflight 失败）。')
          else:
              d = json.load(open(latest, encoding='utf-8'))
              scen = d.get('scenarios') or []
              bad = [s for s in scen if s.get('status') not in ('passed', 'skipped')]
              lines.append('## 仿真结果：%s' % d.get('status'))
              lines.append('')
              lines.append('| 项 | 值 |')
              lines.append('|---|---|')
              lines.append('| run_id | `%s` |' % d.get('run_id'))
              lines.append('| 场景数 | %d |' % len(scen))
              lines.append('| 失败数 | **%d** |' % len(bad))
              lines.append('| 耗时 | %s → %s |' % (d.get('started_at'), d.get('finished_at')))
              lines.append('')
              if bad:
                  lines.append('### 失败场景（这是定位根因的关键，不要只贴结尾几行日志）')
                  lines.append('')
                  for s in bad:
                      lines.append('#### `%s` — %s' % (s.get('id'), s.get('title') or ''))
                      lines.append('')
                      lines.append('```')
                      lines.append(str(s.get('failure') or s.get('error') or '(无 failure 字段)'))
                      lines.append('```')
                      lines.append('')
              else:
                  lines.append('无失败场景 ✅')
          text = '\n'.join(lines) + '\n'
          # 只在真的写文件时写；out 缺省是 /dev/stdout 时直接 print，
          # 否则会**打印两遍**（write 一遍 + print 一遍）—— 实测踩到过。
          if out and out != '/dev/stdout':
              open(out, 'a', encoding='utf-8').write(text)
          print(text, end='')
          PY

      # summary.json（失败详情 + 证据）与 server.log 在失败时最有价值。
      # 路径是仓库根的 .logs/simulation，不是 backend/.logs —— harness 的证据目录
      # 固定在 repoRoot/.logs/simulation（env.go:198 经 repoRoot 向上查找 backend/go.mod），
      # 与 go test 的工作目录无关；uses 步骤的 path 也相对 GITHUB_WORKSPACE 而非
      # defaults.run.working-directory。写成 backend/.logs/... 会永远匹配不到。
      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-evidence
          path: .logs/simulation/
          if-no-files-found: ignore

  # ─── Frontend: lint + unit tests ─────────────────────────────────
  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-shared
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend-shared/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (type-check)
        run: pnpm typecheck

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Coverage gate (≥25%)
        run: |
          COV=$(cat coverage/coverage-summary.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          total=d.get('total',{}).get('lines',{}).get('pct',0)
          print(total)
          ")
          echo "Total line coverage: ${COV}%"
          if [ "$(echo "$COV < 25" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COV}% is below 25% threshold"
            exit 1
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend-shared/coverage/

  # ─── Firmware: ESP32 host tests ──────────────────────────────────
  # host_tests 为纯 host 构建（gcc + cmake 即可，无需 ESP-IDF）：
  # CMakeLists.txt 自带 stubs，不依赖 managed_components；
  # pthread 与 -Wl,--wrap= 均为 ubuntu-latest 标准 GNU 特性。
  firmware:
    name: Firmware (host tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32-collector
    steps:
      - uses: actions/checkout@v4

      - name: Show cmake version
        run: cmake --version

      # 构建目录放在 runner.temp，避免污染工作树
      - name: Configure host tests
        run: cmake -S host_tests -B "${{ runner.temp }}/host-tests"

      - name: Build host tests
        run: cmake --build "${{ runner.temp }}/host-tests" -j8

      - name: Run host tests
        run: ctest --test-dir "${{ runner.temp }}/host-tests" --output-on-failure

  # ─── Docs: 文档「声称-实现」对账 —— 分类器自校准 ─────────────────
  # 只跑 --selftest：它断言的是「分类器没坏」（全通过=0，任一失败=1）。
  # 默认扫描模式总是退出 0（清单需人工复核，命中数不是门禁判据）；
  # --fail-on-candidates 被脚本头部明确排除在 CI 之外（会逼团队收窄规则到扫不到）。
  # 不并入 Backend/Frontend：门禁分层跑，失败要能一眼定位。
  docs-claims-audit:
    name: Docs claims audit (classifier selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run claims-audit classifier selftest
        run: bash tools/docs/claims-audit.sh --selftest

  # ─── Summary ─────────────────────────────────────────────────────
  summary:
    name: CI Summary
    if: always()
    runs-on: ubuntu-latest
    needs: [backend, backend-integration, backend-scenarios, frontend, firmware]
    steps:
      - name: Check results
        run: |
          echo "Backend:       ${{ needs.backend.result }}"
          echo "Integration:   ${{ needs.backend-integration.result }}"
          echo "Scenarios:     ${{ needs.backend-scenarios.result }}"
          echo "Frontend:      ${{ needs.frontend.result }}"
          echo "Firmware:      ${{ needs.firmware.result }}"
          if [ "${{ needs.backend.result }}" = "failure" ] || \
             [ "${{ needs.backend-integration.result }}" = "failure" ] || \
             [ "${{ needs.backend-scenarios.result }}" = "failure" ] || \
             [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.firmware.result }}" = "failure" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
