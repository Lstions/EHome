database:
  host: localhost
  port: 5434
  user: ehome
  password: ehome123
  dbname: ehome
  sslmode: disable
mqtt:
  broker: tcp://localhost:1883
redis:
  addr: localhost:6379
server:
  addr: ":8080"
log:
  level: info
control:
  # V2 outbox dispatcher is enabled by default: implemented control actions
  # are available without an allowlist. Set false only as an emergency
  # kill switch that stops the dispatcher entirely.
  device_control_v2_enabled: true
  # "bridge" is reserved for the future CommandExecution adapter and never
  # enables the current fire-and-forget implementation.
  legacy_device_write_mode: disabled
  # Operator intent only. Raw routes remain closed until the audited
  # diagnostics service is implemented.
  raw_diagnostics_enabled: false
