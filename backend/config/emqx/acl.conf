%% EHomeSystem ACL rules
%% Devices can only publish to devices/{their-id}/up and subscribe to devices/{their-id}/down
%% Backend (ehome-server-v2) has full access
%% Dashboard has access to $SYS/#

%% Allow local server full access
{allow, {clientid, "ehome-server-v2"}, all, ["#"]}.

%% Allow devices to publish to their own up topic and subscribe to their down topic
{allow, all, publish, ["devices/${clientid}/up"]}.
{allow, all, subscribe, ["devices/${clientid}/down"]}.

%% Allow dashboard access to $SYS for monitoring
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.

%% Deny $SYS subscriptions from all others
{deny, all, subscribe, ["$SYS/#"]}.

%% Default: deny (changed from allow-all in production)
{deny, all}.
