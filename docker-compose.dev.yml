name: ehome-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ehome-dev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ehome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehome123}
      POSTGRES_DB: ${POSTGRES_DB:-ehome}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/dev/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ehome}"]
      interval: 3s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ehome-dev-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  emqx:
    image: emqx/emqx:5.7
    container_name: ehome-dev-emqx
    ports:
      - "${EMQX_MQTT_PORT:-1884}:1883"
      - "${EMQX_WS_PORT:-8084}:8083"
      - "${EMQX_DASHBOARD_PORT:-18084}:18083"
    environment:
      EMQX_NAME: ehome-dev
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  default:
    name: ehome-dev-network

volumes:
  postgres-data:
    name: ehome-dev-postgres-data
  redis-data:
    name: ehome-dev-redis-data
  emqx-data:
    name: ehome-dev-emqx-data
