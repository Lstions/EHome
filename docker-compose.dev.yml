# ============================================================
# EHomeSystem Development Override
# 用法:  docker compose -f docker-compose.dev.yml -p ehomesystem-dev up -d --build
# 开发环境共享生产基础设施 (postgres/redis/emqx)，只替换 frontend + backend
# ============================================================

services:
  frontend:
    build:
      context: ./frontend-shared
      dockerfile: dev.Dockerfile
    container_name: ehome-frontend-dev
    ports:
      - "${FRONTEND_DEV_PORT:-5174}:5174"
    volumes:
      - ./frontend-shared/src:/app/src:rw
      - ./frontend-shared/public:/app/public:ro
      - ./frontend-shared/index.html:/app/index.html:ro
      - ./frontend-shared/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend-shared/tsconfig.json:/app/tsconfig.json:ro
    environment:
      VITE_API_TARGET: http://ehome-backend-dev:8080
    networks:
      - ehomesystem_default

  backend:
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    container_name: ehome-backend-dev
    ports:
      - "${BACKEND_DEV_PORT:-8081}:8080"
    volumes:
      - ./backend:/app:rw
      - ehome-dev-cache:/root/.cache/go-build
    environment:
      EHOME_DB_HOST: ehome-postgres
      EHOME_DB_PORT: "5432"
      EHOME_DB_USER: ${POSTGRES_USER:-ehome}
      EHOME_DB_PASSWORD: ${POSTGRES_PASSWORD:-ehome123}
      EHOME_DB_NAME: ${POSTGRES_DB:-ehome}
      MQTT_BROKER: tcp://ehome-emqx:1883
      REDIS_ADDR: ehome-redis:6379
      EHOME_REDIS_ADDR: ehome-redis:6379
      EHOME_MQTT_BROKER: tcp://ehome-emqx:1883
      EHOME_EXTERNAL_HOST: ${EHOME_EXTERNAL_HOST:-192.168.20.3:8080}
      SEED_TEST_DATA: "true"
      LOG_LEVEL: debug
    working_dir: /app
    command: ["air", "-c", ".air.toml"]
    networks:
      - ehomesystem_default

volumes:
  ehome-dev-cache:

networks:
  ehomesystem_default:
    external: true
