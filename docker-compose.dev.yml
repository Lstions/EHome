# EHomeSystem Development Infrastructure
# Usage: docker compose -f docker-compose.dev.yml up -d
#   Then run: make backend && make frontend (or use IDE)
#
# Overrides docker-compose.yml to expose DB/Redis ports and
# provide individual app services for full-Docker local dev.

services:
  # PostgreSQL — expose 5434 for local backend on host
  postgres:
    ports:
      - "${POSTGRES_PORT:-5434}:5432"

  # Redis — expose 6379 for local backend on host
  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Individual backend (local dev: use `make backend` instead)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ehome-backend:dev
    container_name: ehome-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      GIN_MODE: debug
      EHOME_DB_HOST: postgres
      EHOME_DB_PORT: "5432"
      EHOME_DB_USER: ${POSTGRES_USER:-ehome}
      EHOME_DB_PASSWORD: ${POSTGRES_PASSWORD:-ehome123}
      EHOME_DB_NAME: ${POSTGRES_DB:-ehome}
      EHOME_DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      MQTT_BROKER: tcp://emqx:1883
      EHOME_MQTT_CLIENT_ID: ehome-backend-dev
      EHOME_EXTERNAL_HOST: ${EHOME_EXTERNAL_HOST:-192.168.20.3:8080}
      EHOME_JWT_SECRET: ${EHOME_JWT_SECRET:-}
    volumes:
      - ./backend/firmwares:/app/firmwares
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy

  # Individual frontend (local dev: use `make frontend` instead)
  frontend:
    build:
      context: ./frontend-shared
      dockerfile: Dockerfile
    image: ehome-frontend:dev
    container_name: ehome-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend
