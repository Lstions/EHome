# EHomeSystem — 镜像部署版 docker-compose
# 使用 GitHub Packages 构建好的镜像,数据全部持久化到本地 ./data 目录
# 一键打包整个目录即可迁移: tar czf ehome.tar.gz docker-compose.example.yml .env data/
# 部署: tar xzf ehome.tar.gz && docker compose -f docker-compose.example.yml --env-file .env up -d

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: ehome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err — POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err — POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ehome}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ehome-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  emqx:
    image: emqx/emqx:5.8
    container_name: ehome-emqx
    restart: unless-stopped
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"
      - "${EMQX_WS_PORT:-8083}:8083"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    environment:
      EMQX_NAME: ehome
      EMQX_LOADED_MODULES: "emqx_mod_acl_internal"
    volumes:
      - ./data/emqx:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ehome:
    image: ghcr.io/lstions/ehome:latest
    container_name: ehome-web
    restart: unless-stopped
    ports:
      - "${HOME_PORT:-80}:8080"
    environment:
      GIN_MODE: release
      EHOME_DB_HOST: postgres
      EHOME_DB_PORT: "5432"
      EHOME_DB_USER: ${POSTGRES_USER}
      EHOME_DB_PASSWORD: ${POSTGRES_PASSWORD}
      EHOME_DB_NAME: ${POSTGRES_DB:-ehome}
      EHOME_DB_SSLMODE: ${EHOME_DB_SSLMODE:-disable}
      REDIS_ADDR: redis:6379
      MQTT_BROKER: tcp://emqx:1883
      EHOME_MQTT_CLIENT_ID: ehome-server
      EHOME_EXTERNAL_HOST: ${EHOME_EXTERNAL_HOST:?err — EHOME_EXTERNAL_HOST is required}
      EHOME_JWT_SECRET: ${EHOME_JWT_SECRET:?err — EHOME_JWT_SECRET is required}
      EHOME_ALLOWED_ORIGINS: ${EHOME_ALLOWED_ORIGINS:-}
      EHOME_STATIC_DIR: /app/static/dist
    volumes:
      - ./data/firmwares:/app/firmwares
    # 就绪探针 —— 必须用 /readyz，**不能**用 /health：
    #
    #   启动期数据库优化（分区迁移 / 补建 F-10 索引 / DROP 死索引）会在
    #   database.Connect 之前就监听端口（让浏览器能显示维护页进度），
    #   此时 /health 返回 **200**（进程活着），而 /readyz 返回 **503**
    #   （业务路由尚未注册）。探 /health 会让编排在迁移没做完时就把流量
    #   打进来 —— 用户拿到一堆 503 业务错误而不是维护页。
    #   语义见 docs/设计/启动期数据库优化与进度展示-契约-2026-11-06.md §3.3。
    #
    # start_period 给足：首次升级到含 F-10 索引的镜像时，生产要在 69.6M 行上
    # 补建两条复合索引（实测 +4.51 GB，分钟级 DDL）。这个值应随数据量上调。
    # 运行期 alpine 自带 busybox wget，无需额外安装。
    #
    #   ⚠ 不要给本容器注入 HTTP_PROXY / HTTPS_PROXY：运行镜像是 alpine（busybox wget），
    #   它**不认 no_proxy**，连 http://localhost:8080 也会走代理 ⇒ 探针永远 unhealthy，
    #   表现为「服务明明能用但一直重启/不健康」。2026-11-06 实测：清空代理变量后
    #   200→exit 0、503→exit 1、连接拒绝→exit 1，语义正确。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
