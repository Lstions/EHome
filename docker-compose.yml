services:
  # PostgreSQL database (unified infra: host port bound to 127.0.0.1 for local dev)
  postgres:
    image: postgres:18.6-alpine
    container_name: ehome-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err — POSTGRES_PASSWORD is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err — POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ehome}
    volumes:
      - ehome-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5


  # Unified frontend+backend — single service, exposes port 80 only
  ehome:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ehome-web
    restart: unless-stopped
    ports:
      - "${HOME_PORT:-80}:8080"
    environment:
      GIN_MODE: release
      EHOME_DB_HOST: postgres
      EHOME_DB_PORT: "5432"
      EHOME_DB_USER: ${POSTGRES_USER}
      EHOME_DB_PASSWORD: ${POSTGRES_PASSWORD}
      EHOME_DB_NAME: ${POSTGRES_DB:-ehome}
      EHOME_DB_SSLMODE: ${EHOME_DB_SSLMODE:-disable}
      EHOME_EXTERNAL_HOST: ${EHOME_EXTERNAL_HOST:?err — EHOME_EXTERNAL_HOST is required in production}
      EHOME_JWT_SECRET: ${EHOME_JWT_SECRET:?err — EHOME_JWT_SECRET is required in production}
      # CORS origin allowlist (comma-separated). Empty = same-origin only (no CORS middleware).
      # Only needed when the frontend is served from a different origin than the backend.
      EHOME_ALLOWED_ORIGINS: ${EHOME_ALLOWED_ORIGINS:-}
      # 数据保留期快照 (天): 新建逻辑设备 retention_days 的默认值; 存量不受后续变更影响
      EHOME_DATA_RETENTION_DAYS: ${EHOME_DATA_RETENTION_DAYS:-90}
      EHOME_STATIC_DIR: /app/static/dist
    volumes:
      - ./backend/firmwares:/app/firmwares
    # 就绪探针 —— 必须用 /readyz，**不能**用 /health：
    #
    #   启动期数据库优化（分区迁移 / 补建 F-10 索引 / DROP 死索引）会在
    #   database.Connect 之前就监听端口（让浏览器能显示维护页进度），
    #   此时 /health 返回 **200**（进程活着），而 /readyz 返回 **503**
    #   （业务路由尚未注册）。探 /health 会让编排在迁移没做完时就把流量
    #   打进来 —— 用户拿到一堆 503 业务错误而不是维护页。
    #   语义见 docs/设计/启动期数据库优化与进度展示-契约-2026-11-06.md §3.3。
    #
    # start_period 给足：首次升级到含 F-10 索引的镜像时，生产要在 69.6M 行上
    # 补建两条复合索引（实测 +4.51 GB，分钟级 DDL）。这个值应随数据量上调。
    # 运行期 alpine 自带 busybox wget，无需额外安装。
    #
    #   ⚠ 不要给本容器注入 HTTP_PROXY / HTTPS_PROXY：运行镜像是 alpine（busybox wget），
    #   它**不认 no_proxy**，连 http://localhost:8080 也会走代理 ⇒ 探针永远 unhealthy，
    #   表现为「服务明明能用但一直重启/不健康」。2026-11-06 实测：清空代理变量后
    #   200→exit 0、503→exit 1、连接拒绝→exit 1，语义正确。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy

  # ── Optional monitoring stack (profile: monitoring) ───────────────────────
  # Not part of the default startup: enabling the profile is the only opt-in.
  # Joined to the main stack default network so the scrape target
  # `ehome-web:8080` (deploy/monitoring/prometheus.yml) resolves.
  # Start with: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: ehome-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ehome-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: ehome-alertmanager
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ehome-alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

volumes:
  ehome-pgdata:
  ehome-prometheus-data:
  ehome-alertmanager-data:
