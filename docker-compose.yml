services:
  # PostgreSQL database (unified infra: host port bound to 127.0.0.1 for local dev)
  postgres:
    image: postgres:18-alpine
    container_name: ehome-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err — POSTGRES_PASSWORD is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err — POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ehome}
    volumes:
      - ehome-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis cache (unified infra: host port bound to 127.0.0.1 for local dev)
  redis:
    image: redis:7-alpine
    container_name: ehome-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ehome-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # EMQX MQTT broker (unified infra: host ports bound to 127.0.0.1)
  emqx:
    image: emqx/emqx:5.8
    container_name: ehome-emqx
    restart: unless-stopped
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"
      - "${EMQX_WS_PORT:-8083}:8083"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    environment:
      EMQX_NAME: ehome
      EMQX_LOADED_MODULES: "emqx_mod_acl_internal"
    volumes:
      - ehome-emqxdata:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Unified frontend+backend — single service, exposes port 80 only
  ehome:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ehome-web
    restart: unless-stopped
    ports:
      - "${HOME_PORT:-80}:8080"
    environment:
      GIN_MODE: release
      EHOME_DB_HOST: postgres
      EHOME_DB_PORT: "5432"
      EHOME_DB_USER: ${POSTGRES_USER}
      EHOME_DB_PASSWORD: ${POSTGRES_PASSWORD}
      EHOME_DB_NAME: ${POSTGRES_DB:-ehome}
      EHOME_DB_SSLMODE: ${EHOME_DB_SSLMODE:-disable}
      REDIS_ADDR: redis:6379
      MQTT_BROKER: tcp://emqx:1883
      EHOME_MQTT_CLIENT_ID: ehome-server
      EHOME_EXTERNAL_HOST: ${EHOME_EXTERNAL_HOST:?err — EHOME_EXTERNAL_HOST is required in production}
      EHOME_JWT_SECRET: ${EHOME_JWT_SECRET:?err — EHOME_JWT_SECRET is required in production}
      # CORS origin allowlist (comma-separated). Empty = same-origin only (no CORS middleware).
      # Only needed when the frontend is served from a different origin than the backend.
      EHOME_ALLOWED_ORIGINS: ${EHOME_ALLOWED_ORIGINS:-}
      # 数据保留期快照 (天): 新建逻辑设备 retention_days 的默认值; 存量不受后续变更影响
      EHOME_DATA_RETENTION_DAYS: ${EHOME_DATA_RETENTION_DAYS:-365}
      EHOME_STATIC_DIR: /app/static/dist
    volumes:
      - ./backend/firmwares:/app/firmwares
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy

volumes:
  ehome-pgdata:
  ehome-redisdata:
  ehome-emqxdata:
