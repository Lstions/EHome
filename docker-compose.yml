services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: ehome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ehome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehome123}
      POSTGRES_DB: ${POSTGRES_DB:-ehome}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ehome-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ehome}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: ehome-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ehome-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # EMQX MQTT broker
  emqx:
    image: emqx/emqx:5.7
    container_name: ehome-emqx
    restart: unless-stopped
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"
      - "${EMQX_WS_PORT:-8083}:8083"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    environment:
      EMQX_NAME: ehome
      EMQX_LOADED_MODULES: "emqx_mod_acl_internal"
    volumes:
      - ehome-emqxdata:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # EHomeSystem frontend (Vue3 SPA)
  frontend:
    build:
      context: ./frontend-shared
      dockerfile: Dockerfile
    container_name: ehome-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

  # EHomeSystem backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ehome-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      EHOME_DB_HOST: postgres
      EHOME_DB_PORT: "5432"
      EHOME_DB_USER: ${POSTGRES_USER:-ehome}
      EHOME_DB_PASSWORD: ${POSTGRES_PASSWORD:-ehome123}
      EHOME_DB_NAME: ${POSTGRES_DB:-ehome}
      EHOME_REDIS_ADDR: redis:6379
      EHOME_MQTT_BROKER: tcp://emqx:1883
      EHOME_MQTT_CLIENT_ID: ehome-backend
    volumes:
      - ./backend/firmwares:/app/firmwares

volumes:
  ehome-pgdata:
  ehome-redisdata:
  ehome-emqxdata:
