# docker-compose.test.yml — Integration test infrastructure
# Usage: docker compose -f docker-compose.test.yml up -d
#   Then run: EHOME_TEST_DB=postgres go test -tags=integration ./...
#
# This starts ONLY the infrastructure services (PG + Redis + EMQX)
# with ephemeral data — no persistent volumes, no app containers.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ehome-test-postgres
    environment:
      POSTGRES_USER: ehome
      POSTGRES_PASSWORD: ehome123
      POSTGRES_DB: ehome_test
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehome"]
      interval: 3s
      timeout: 2s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ehome-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    tmpfs:
      - /data

  emqx:
    image: emqx/emqx:5.7
    container_name: ehome-test-emqx
    ports:
      - "1884:1883"
      - "8084:8083"
      - "18084:18083"
    environment:
      EMQX_NAME: ehome-test
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /opt/emqx/data
