# 隔离验证栈：验证「OTA 历史表脏行」修复（前端产物变更，需新镜像）
# 用真实 PG + 造一条 OTA 记录，浏览器核对表格渲染。
name: ehome-otahist

services:
  postgres:
    image: postgres:18-alpine
    container_name: ehome-otahist-postgres
    environment:
      POSTGRES_USER: ehome
      POSTGRES_PASSWORD: ehome_otahist_pw
      POSTGRES_DB: ehome
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehome"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - otahist_pgdata:/var/lib/postgresql

  emqx:
    image: emqx/emqx:5.8
    container_name: ehome-otahist-emqx
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ehome:
    image: ehome-otahist:local
    container_name: ehome-otahist-web
    ports:
      - "18093:8080"
    environment:
      GIN_MODE: release
      EHOME_DB_HOST: postgres
      EHOME_DB_PORT: "5432"
      EHOME_DB_USER: ehome
      EHOME_DB_PASSWORD: ehome_otahist_pw
      EHOME_DB_NAME: ehome
      EHOME_DB_SSLMODE: disable
      MQTT_BROKER: tcp://emqx:1883
      EHOME_MQTT_CLIENT_ID: ehome-otahist
      EHOME_EXTERNAL_HOST: 127.0.0.1:18093
      EHOME_JWT_SECRET: otahist_secret_0123456789abcdef0123456789
      EHOME_STATIC_DIR: /app/static/dist
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy

volumes:
  otahist_pgdata:
