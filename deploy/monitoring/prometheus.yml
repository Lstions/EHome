# F6 数据落库失败告警 — Prometheus 抓取配置
#
# 抓取目标: ehome-server 的公开 Prometheus 端点
#   生产:  http://ehome-web:8080/metrics   (docker-compose.yml ehome 服务, 容器内端口 8080)
#   开发:  http://localhost:8082/metrics   (docker-compose.dev.yml 后端映射端口)
#
# scrape_interval=15s 与 docs/设计/系统监控/详细设计.md §3.3 约定一致。
# 认证: /metrics 是公开无认证端点 (routes.go:55) —— 仅暴露计数器与标签, 无行级数据。
#   若 ehome 反代 (nginx) 前置 TLS, 将 http:// 改为 https:// 并在
#   scheme/tls_config 中配置客户端证书。

global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: ehome-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - ehome-web:8080
        labels:
          service: ehome-server
